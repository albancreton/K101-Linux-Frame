<!doctype html>
<!-- Touch calibration targets (tools/calibrate-touch.sh). Tapping anywhere
     advances, so it works even while touch is badly calibrated. -->
<meta charset="utf-8">
<title>Calibrate</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #ddd;
    font: 28px sans-serif; overflow: hidden; touch-action: none; user-select: none; }
  #msg { position: absolute; top: 45%; width: 100%; text-align: center; }
  .t { position: absolute; width: 60px; height: 60px; margin: -30px 0 0 -30px; }
  .t::before, .t::after { content: ""; position: absolute; background: #ff3b30; }
  .t::before { left: 29px; top: 0; width: 2px; height: 60px; }
  .t::after { top: 29px; left: 0; height: 2px; width: 60px; }
</style>
<div id="msg"></div>
<div class="t" id="t"></div>
<script>
  // Same order and positions as tools/calibrate-touch.sh
  const pts = [[64, 64], [1216, 64], [1216, 736], [64, 736], [640, 400]];
  let i = 0;
  const t = document.getElementById("t"), msg = document.getElementById("msg");
  function show() {
    if (i >= pts.length) { t.remove(); msg.textContent = "Done, thanks"; return; }
    t.style.left = pts[i][0] + "px"; t.style.top = pts[i][1] + "px";
    msg.textContent = `Tap the red cross, firmly, once (${i + 1}/${pts.length})`;
  }
  let busy = false;
  addEventListener("pointerdown", () => {
    if (busy) return;
    busy = true; i++; show();
    setTimeout(() => busy = false, 700);  // ignore bounces
  });
  show();
</script>
