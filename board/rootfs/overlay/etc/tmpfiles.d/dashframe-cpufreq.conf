# schedutil defaults to a 366 us rate limit (1.5x the DT transition latency),
# but each switch goes through the PMIC over RSB and takes far longer: under
# load the governor thread ate ~30% of a core. 50 ms cuts the >50 ms frames
# in the scroll benchmark roughly in half.
w /sys/devices/system/cpu/cpufreq/schedutil/rate_limit_us - - - - 50000
