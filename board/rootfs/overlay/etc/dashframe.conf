# Page shown by the kiosk (kiosk.service). Builds use secrets/dashframe.conf
# instead when it exists; on a running frame, edit this file and
# `systemctl restart kiosk`.
DASHBOARD_URL=https://example.com
# Browser engine: wpe (default, GPU-composited) or chromium (CPU-rendered fallback).
BROWSER=wpe
# Kiosk menu: hold a finger this long in this corner (top-left, top-right,
# bottom-left, bottom-right) to open it (kiosk-menu-gesture.service).
MENU_CORNER=top-left
MENU_HOLD_SECONDS=2
